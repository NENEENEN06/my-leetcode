<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LeetCode Solutions · 索引</title>
<style>
  :root { color-scheme: light dark; }
  body { margin: 0; padding: 14px 16px 26px;
         font: 14px/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
         color: var(--foreground, #1f2328); background: var(--card, transparent); }
  h1 { font-size: 17px; margin: 0 0 2px; font-weight: 650; }
  .sub { margin: 0 0 11px; font-size: 12px; color: var(--muted-foreground, #656d76); }
  .bar { display: flex; flex-wrap: wrap; gap: 7px; align-items: center; margin-bottom: 7px; }
  input[type="search"] { flex: 1 1 200px; min-width: 170px; padding: 6px 10px; font: inherit;
        color: inherit; background: transparent; border: 1px solid var(--border, #d0d7de);
        border-radius: 7px; outline: none; }
  input[type="search"]:focus { border-color: var(--accent, #0969da); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { padding: 2px 9px; font-size: 12px; cursor: pointer; user-select: none;
        color: var(--muted-foreground, #656d76); background: transparent;
        border: 1px solid var(--border, #d0d7de); border-radius: 999px; }
  .chip[aria-pressed="true"] { color: var(--foreground, #1f2328); border-color: var(--accent, #0969da);
        background: color-mix(in srgb, var(--accent, #0969da) 12%, transparent); }
  .count { font-size: 12px; color: var(--muted-foreground, #656d76); margin: 8px 0 6px; }
  table { border-collapse: collapse; width: 100%; }
  th, td { padding: 5px 8px; text-align: left; border-bottom: 1px solid var(--border, #d8dee4);
        vertical-align: top; }
  th { font-size: 12px; font-weight: 600; color: var(--muted-foreground, #656d76); }
  td.num { font-variant-numeric: tabular-nums; color: var(--muted-foreground, #656d76); white-space: nowrap; }
  td.diff { white-space: nowrap; font-size: 12px; color: var(--muted-foreground, #656d76); }
  td.tags { font-size: 12px; color: var(--muted-foreground, #656d76); }
  a { color: var(--accent, #0969da); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .lc { font-size: 11px; opacity: .75; margin-left: 6px; white-space: nowrap; }
  #empty { display: none; padding: 14px 4px; color: var(--muted-foreground, #656d76); font-size: 13px; }
</style>
</head>
<body>
<h1>LeetCode Solutions</h1>
<p class="sub">按难度、算法筛选，或输入题号 / 标题 / 标签搜索；点题号打开本地题解。</p>
<div class="bar">
  <input id="q" type="search" placeholder="搜索题号 / 标题 / 标签，如 835、matrix、dp" autocomplete="off">
  <span class="chips" id="diffs"></span>
</div>
<div class="bar"><span class="chips" id="topics"></span></div>
<div class="count" id="count"></div>
<table>
  <thead><tr><th>#</th><th>Problem</th><th>Difficulty</th><th>Topics</th></tr></thead>
  <tbody id="rows"></tbody>
</table>
<div id="empty">没有匹配的题目。</div>
<script>

  ],

 {

 {

  "title": "Smallest Stable Index II",

  ],
  "rel": "solutions/3904-smallest-stable-index-ii/README.md",
  "gh": "https://github.com/NENEENEN06/my-leetcode/blob/main/solutions/3904-smallest-stable-index-ii/README.md",
  "url": "https://leetcode.cn/problems/smallest-stable-index-ii/description/"
 }
];
const state = { q: "", diff: "all", topic: "all" };
const el = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function buildChips(container, values, key) {
  const all = document.createElement("button");
  all.className = "chip";
  all.textContent = key === "diff" ? "全部难度" : "全部算法";
  all.dataset.value = "all";
  container.appendChild(all);
  values.forEach((v) => {
    const b = document.createElement("button");
    b.className = "chip";
    b.textContent = v + " " + count(v, key);
    b.dataset.value = v;
    container.appendChild(b);
  });
  container.addEventListener("click", (e) => {
    const chip = e.target.closest(".chip");
    if (!chip) return;
    state[key] = chip.dataset.value;
    render();
  });
}

function count(value, key) {
  if (value === "all") return "";
  if (key === "diff") return DATA.filter((r) => r.difficulty === value).length;
  return DATA.filter((r) => (r.topics || []).includes(value)).length;
}

function abbrsOf(r) {
  // “Dynamic Programming” -> dp、“Depth-First Search” -> dfs，让习惯用缩写的搜索也能命中
  return (r.topics || []).map((t) => t.split(/[\s/\-]+/).filter(Boolean).map((w) => w[0]).join("").toLowerCase())
    .filter((a) => a.length >= 2);
}

function match(r) {
if (state.diff !== "all" && r.difficulty !== state.diff) return false;
if (state.topic !== "all" && !(r.topics || []).includes(state.topic)) return false;
const q = state.q.trim().toLowerCase();
if (!q) return true;
const hay = [String(r.number), String(r.number).padStart(4, "0"), r.title,
(r.topics || []).join(" "), abbrsOf(r).join(" ")]
.join(" ").toLowerCase();
return hay.includes(q);
}

// 本地双击打开 -> 跳本地题解；托管在 GitHub Pages / 任何 http 下 -> 跳 GitHub 渲染页（裸 .md 在 Pages 上只能当文本下载）
function href(r) {
return (location.protocol === "file:" || !r.gh) ? r.rel : r.gh;
}

function render() {
  document.querySelectorAll(".chip").forEach((c) => {
    const key = c.parentElement.id === "diffs" ? "diff" : "topic";
    c.setAttribute("aria-pressed", String(state[key] === c.dataset.value));
  });
  const rows = DATA.filter(match);
  el("rows") .innerHTML = rows.map((r) => {
    const tags = (r.topics || []).join(", ");
    const lc = r.url ? ' <a class="lc" href="' + esc(r.url) + '" target="_blank" rel="noreferrer">LeetCode &nearr;</a>' : "";
    return "<tr>" +
      '<td class="num"><a href="' + esc(href(r)) + '">' + String(r.number).padStart(4, "0") + "</a></td>" +
      '<td><a href="' + esc(href(r)) + '">' + esc(r.title) + "</a>" + lc + "</td>" +
      '<td class="diff">' + esc(r.difficulty) + "</td>" +
      '<td class="tags">' + esc(tags) + "</td>" +
      "</tr>";
  }).join("");
  el("count").textContent = "显示 " + rows.length + " / " + DATA.length + " 题";
  el("empty").style.display = rows.length ? "none" : "block";
}

const diffs = [...new Set(DATA.map((r) => r.difficulty).filter(Boolean))]
  .sort((a, b) => ["Easy", "Medium", "Hard"].indexOf(a) - ["Easy", "Medium", "Hard"].indexOf(b));
const topics = [...new Set(DATA.flatMap((r) => r.topics || []))]
  .sort((a, b) => DATA.filter((r) => r.topics.includes(b)).length - DATA.filter((r) => r.topics.includes(a)).length || a.localeCompare(b));
buildChips(el("diffs"), diffs, "diff");
buildChips(el("topics"), topics, "topic");
el("q").addEventListener("input", (e) => { state.q = e.target.value; render(); });
render();
</script>
</body>
</html>
