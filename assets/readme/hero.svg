<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">LeetCode Solutions 刷题记录</title>
  <desc id="desc">LeetCode 刷题笔记：中文题解与 C++ 代码，按题号整理，每题一个目录。</desc>

  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#161A20" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="26" fill="#0B0C0F"/>
  <rect width="1200" height="360" rx="26" fill="url(#grid)" opacity="0.35"/>

  <g id="title-block" transform="translate(64 64)">
    <text x="0" y="30" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" letter-spacing="3" fill="#7A808C">LEETCODE · 刷题记录</text>
    <text x="0" y="116" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-weight="700" font-size="64" fill="#F5F7FA">LeetCode Solutions</text>
    <text x="0" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="26" fill="#C6CBD3">中文题解 + C++ 代码，按题号整理</text>

    <g id="metadata" transform="translate(0 186)">
      <rect x="0" y="-30" width="118" height="42" rx="8" fill="#161A20" stroke="#23262E" stroke-width="1"/>
      <text x="59" y="0" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" fill="#E6E9ED">C++17</text>
      <rect x="134" y="-30" width="134" height="42" rx="8" fill="#161A20" stroke="#23262E" stroke-width="1"/>
      <text x="201" y="0" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="20" fill="#E6E9ED">中文题解</text>
    </g>
  </g>

  <g id="structure" transform="translate(756 64)">
    <rect width="380" height="232" rx="18" fill="#101319" stroke="#23262E" stroke-width="1"/>
    <text x="36" y="40" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" letter-spacing="2" fill="#7A808C">EACH PROBLEM</text>
    <text x="36" y="82" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="24" fill="#F5F7FA">&lt;problem-id&gt;/</text>
    <text x="36" y="130" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" fill="#E6E9ED">README.md</text>
    <text x="212" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="20" fill="#7A808C">中文题解</text>
    <text x="36" y="172" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="22" fill="#E6E9ED">solution.cpp</text>
    <text x="212" y="172" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="20" fill="#7A808C">C++ 实现</text>
  </g>
</svg>
